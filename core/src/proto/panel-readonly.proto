syntax = "proto3";
package gamepb.panelreadpb;

// Read-only wire layouts. No write requests or commands are defined here.

message GetCollectionsRequest {
  repeated int32 categories = 1;
}

message GetCollectionsReply {
  repeated CategoryDetail details = 1;
  repeated DisplaySlot display_slots = 2;
}

message CollectionInfo {
  int64 collection_id = 1;
  int32 star_level = 2;
  bool is_new = 3;
  int64 first_obtained_time = 4;
  int64 own_count = 5;
}

message PedestalInfo {
  int64 pedestal_id = 1;
  bool is_new = 2;
}

message WishInfo {
  int32 series_id = 1;
  int64 collection_id = 2;
  int64 cooldown_until = 3;
}

message CategoryDetail {
  int32 category = 1;
  repeated CollectionInfo collections = 2;
  repeated PedestalInfo pedestals = 3;
  repeated WishInfo wished = 4;
  int32 claimed_reward_score = 5;
  int32 current_score = 6;
  int64 collection_like_count = 7;
  int64 pedestal_like_count = 8;
}

message DisplayInfo {
  int32 category = 1;
  int64 item_id = 2;
  int64 pedestal_id = 3;
}

message DisplaySlot {
  int32 slot_type = 1;
  DisplayInfo display = 2;
}

message DogPanelDog {
  int64 id = 1;
  string name = 2;
  int64 field_3 = 3;
  int64 field_4 = 4;
  int64 level = 5;
  int64 field_6 = 6;
  int64 field_7 = 7;
  int64 field_10 = 10;
}

message DogPanelFood {
  int64 id = 1;
  int64 duration = 2;
  int64 field_3 = 3;
}

message DogPanelReply {
  repeated DogPanelDog dogs = 1;
  int64 current_dog_id = 2;
  int64 field_3 = 3;
  int64 field_4 = 4;
  repeated DogPanelFood foods = 5;
  int64 field_6 = 6;
  int64 pending_gift_count = 7;
}
